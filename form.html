<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Application</title>
</head>
<body>
    <header>
        <nav>
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Contacts</a>
        </nav>
    </header>
    <main>
        <section>
            <h1>Welcome to the Islamic University In Uganda.</h1>
            <p>At the Islamic University in Uganda, we pride ourselves in educating the next generation.</p>
        </section>
        <hr>
        <section><h2>Application Form</h2>
        <form action="">
            <label for="full_name">Full Name:</label>
            <input type="text"id="full_name" required>
            <br>

            <label for="email">Email:</label>
            <input type="email" name="" id="email"required>
            <br>

            <label for="age">Age:</label>
            <input type="number" name="" id="age" min="0" max="100" required>
            <br>

            <label for="password">Password:</label>
            <input type="password" name="" id="password" required>
            <br>

            <label for="dob">DOB:</label>
            <input type="date" name="" id="dob" required>
            <br><br>

            <fieldset>
                <input type="radio" name="Lang" id="eng">
                <label for="eng">English</label>

                <input type="radio" name="Lang" id="lug">
                <label for="lug">Luganda</label>

                <input type="radio" name="Lang" id="swl">
                <label for="swl">Swahili</label>

                <input type="radio" name="Lang" id="arb">
                <label for="arb">Arabic</label>
            </fieldset><br>

            <label for="">Courses</label>
            <select name="course" id="course" required>
        <option value="">Choose Your Course</option>
        <option value="computer_science">Computer Science</option>
        <option value="information_technology">Information Technology</option>
        <option value="law">Law</option>
        <option value="medicine">Medicine</option>
        <option value="engineering">Engineering</option>

            <br><br>
        </form>
    </section>
        
    </main>
    
</body>
</html>
